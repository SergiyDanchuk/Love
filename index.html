<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1d1b">
  <title>Для моєї коханої 💛</title>
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <link rel="preload" as="image" href="assets/forest-bg.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="forest-scene" aria-hidden="true">
    <span class="firefly" style="--x:18%;--y:34%;--size:5px;--duration:2.8s;--delay:-.7s"></span>
    <span class="firefly" style="--x:28%;--y:67%;--size:4px;--duration:3.4s;--delay:-1.5s"></span>
    <span class="firefly" style="--x:76%;--y:39%;--size:5px;--duration:3s;--delay:-2s"></span>
    <span class="firefly" style="--x:86%;--y:64%;--size:4px;--duration:2.6s;--delay:-.3s"></span>
    <span class="firefly" style="--x:57%;--y:17%;--size:3px;--duration:3.8s;--delay:-1.1s"></span>
  </div>

  <main class="card" aria-labelledby="greeting">
    <span class="sparkle a" aria-hidden="true">✦</span>
    <span class="sparkle b" aria-hidden="true">✧</span>
    <span class="sparkle c" aria-hidden="true">✧</span>
    <span class="sparkle d" aria-hidden="true">✦</span>

    <p class="eyebrow">моїй булочці з маком</p>
    <h1 id="greeting">Я люблю<span>тебе</span></h1>

    <svg class="heart" viewBox="0 0 64 64" role="img" aria-label="Серце">
      <path fill="currentColor" d="M32 56S6 40 6 22C6 12 18 6 27 15l5 5 5-5c9-9 21-3 21 7 0 18-26 34-26 34Z"/>
      <path fill="#fff8f4" d="M17 20c1-3 4-5 7-4 1 0 2 1 3 2-3-1-6 0-8 3-1 2-2 4-2 7-2-2-2-5 0-8Z" opacity=".8"/>
    </svg>

    <p class="declaration">Ти в мене найкраща<span class="dots">!!!</span></p>
    <button class="hint" id="egg-trigger" type="button">Торкнись листівки 💌</button>
  </main>

  <script defer src="js/app.js"></script>
</body>
</html>
